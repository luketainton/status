name: qualor
on:
  pull_request:
  push:
    branches: [master]
    tags: ['**']
permissions:
  contents: read
jobs:
  qualor:
    # Pull requests from forks get no secrets, so they are skipped.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .qualor/trivy
          key: qualor-trivy-db-${{ github.run_id }}
          restore-keys: qualor-trivy-db-
      - name: Make the vulnerability database cache writable
        run: mkdir -p .qualor/trivy && chmod 0777 .qualor/trivy
      # Install dependencies (JS/TS, Go) or build (Java) here, before the scan.
      - uses: qualor-dev/scan-action@v0.16
        with:
          server-url: https://qualor.tainton.uk
          project-key: luketainton/status
          token: ${{ secrets.QUALOR_TOKEN }}
      - if: always() && hashFiles('.qualor/trivy/server.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .qualor/trivy
          key: qualor-trivy-db-${{ hashFiles('.qualor/trivy/server.json') }}
